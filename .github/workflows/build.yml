# The gate the repository did not have.
#
# "0 warnings, tests green" was held by discipline alone until this file existed, and discipline
# is exactly what a `git bisect` six months from now cannot verify. Directory.Build.props sets
# TreatWarningsAsErrors, so a warning fails the build here rather than scrolling past in a log.
#
# Five jobs, and the shape of them is decided by one fact: MonoGame has no shader compiler of its
# own. On Windows it uses the DirectX one already on the machine; on macOS and Linux it runs that
# same Windows compiler under Wine, which is a 450MB install and, since Homebrew disabled its wine
# casks, a fiddly one. So the content is built once, on the only runner that needs nothing
# installed to do it, and handed to everything else as an artifact. That is possible at all only
# because every head is DesktopGL now - one MonoGame platform, one set of .xnb, three consumers.
# See "Publishing ahead of time" and "CI" in BUILD.md.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Every path below is relative to the solution, which lives in src/ rather than at the root of
# the repository. Set once here rather than per step: this applies to `run` steps only, which is
# every step that takes a path - checkout, setup-dotnet and the artifact actions are actions and
# want paths from the root.
defaults:
  run:
    working-directory: src

jobs:
  # A new cycle is one misfiled file, and this fails in about a second. No restore, no build, no
  # .NET, and no reason to run it once per operating system - so it answers long before the builds
  # finish. tools/namespace-cycles.py counts the namespaces in Starquake.Shared that depend on each
  # other both ways, and the count is zero. Nothing but this keeps it there: C# has no rule against
  # a namespace cycle, which is why it had drifted to fourteen before anything measured it.
  namespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No namespace cycles
        run: python3 tools/namespace-cycles.py

  # Does it compile, and do the tests pass, on all three operating systems.
  #
  # Deliberately independent of the content job, so a compile error reports in a couple of minutes
  # rather than after MGCB has ground through 107MB of art. PrebuiltContentDir pointed at an empty
  # folder is what buys that: it skips the content build outright. Nothing here needs the content -
  # the tests hand the sound engine a ContentManager with nothing in it on purpose - and this job
  # never proved anything about the art, only about the code.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0 as well as 10.0: MGCB is a net8.0 application and so are ProjectMercury and its
          # content pipeline extension, which is why they target net8.0 while the game targets
          # net10.0. See BUILD.md.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compile without content
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/no-content"
          dotnet restore Starquake.sln
          dotnet build Starquake.sln --no-restore -p:PrebuiltContentDir="${{ runner.temp }}/no-content"

      - name: Test
        shell: bash
        run: dotnet test Starquake.Tests/Starquake.Tests.csproj --no-build -p:PrebuiltContentDir="${{ runner.temp }}/no-content"

  # The content, built once for everybody.
  #
  # On Windows because Windows is the one runner with a shader compiler already on it. The output
  # is platform-independent - /platform:DesktopGL, the same .xnb the Mac and Linux heads load - so
  # which runner produced it does not matter to anything downstream.
  content:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build content
        run: dotnet build Starquake.Shared/Starquake.Shared.csproj -c Release

      - name: Upload content
        uses: actions/upload-artifact@v4
        with:
          name: content
          path: src/Starquake.Shared/Content/bin/DesktopGL/Content
          retention-days: 7

  # One native executable per target, each compiled on its own hardware.
  #
  # NativeAOT does not cross-compile. ILC will happily emit code for another operating system - it
  # produces a valid object file - but the link then fails for want of a linker that knows the other
  # platform, so each of these has to run where it is going. That is the whole reason this is a
  # matrix of runners rather than five invocations on one of them.
  publish:
    needs: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64,   head: Starquake.Mac,     runs-on: macos-latest }
          - { rid: osx-x64,     head: Starquake.Mac,     runs-on: macos-latest }
          - { rid: linux-x64,   head: Starquake.Linux,   runs-on: ubuntu-latest }
          - { rid: linux-arm64, head: Starquake.Linux,   runs-on: ubuntu-24.04-arm }
          - { rid: win-x64,     head: Starquake.Windows, runs-on: windows-latest }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # ILC shells out to clang to link and to objcopy to strip symbols. Without the stripping
      # tool the publish fails at the very last step, after all the compiling is done.
      - name: Install the native toolchain
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev binutils

      - name: Download content
        uses: actions/download-artifact@v4
        with:
          name: content
          path: content

      - name: Publish ahead of time
        shell: bash
        run: >
          dotnet publish ${{ matrix.head }}/${{ matrix.head }}.csproj
          -p:PublishProfile=Aot-${{ matrix.rid }}
          -p:PrebuiltContentDir="${{ github.workspace }}/content"

      # A .dmg rather than a zip. It is the Mac-native way to hand someone an application, it
      # preserves the ad-hoc signature that Apple Silicon requires to start the binary at all, and
      # UDZO compression takes the 124MB bundle down to about 30MB - most of the content is .xnb,
      # which compresses hard.
      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: >
          hdiutil create -volname Starquake
          -srcfolder ${{ matrix.head }}/bin/Publish/${{ matrix.rid }}/Starquake.app
          -ov -format UDZO "${{ github.workspace }}/Starquake-${{ matrix.rid }}.dmg"

      # Two things for Linux. The AppImage is the one to hand someone - a single executable file
      # that needs no install - and the tarball is the fallback, because AppImages want libfuse2
      # and Ubuntu has not shipped it by default since 22.04. (A player without it can still run
      # the AppImage with --appimage-extract-and-run, which is also how this builds one.)
      #
      # tar, not zip, for the fallback: zip does not record the executable bit.
      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: |
          set -eux
          out="${{ matrix.head }}/bin/Publish/${{ matrix.rid }}"
          tar -czf "${{ github.workspace }}/Starquake-${{ matrix.rid }}.tar.gz" \
            -C "$out" --exclude='*.pdb' --exclude='*.dbg' .

          rm -rf AppDir && mkdir AppDir
          tar -xzf "${{ github.workspace }}/Starquake-${{ matrix.rid }}.tar.gz" -C AppDir
          cp Starquake.Linux/AppRun Starquake.Linux/starquake.desktop Starquake.Linux/Starquake.png AppDir/
          chmod +x AppDir/AppRun AppDir/Starquake

          # MonoGame.Library.SDL carries no arm64 Linux native, so that build arrives without one
          # and dies on launch. An AppImage is allowed to bring its own, which is the one place
          # this gap can be closed without asking the player to apt-get anything.
          if [ ! -f AppDir/libSDL2-2.0.so.0 ]; then
            sudo apt-get install -y libsdl2-2.0-0
            cp "$(ldconfig -p | awk '/libSDL2-2.0.so.0/ {print $NF; exit}')" AppDir/
          fi

          arch="$(uname -m)"
          wget -qO appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x appimagetool
          ARCH="$arch" ./appimagetool --appimage-extract-and-run AppDir \
            "${{ github.workspace }}/Starquake-${{ matrix.rid }}.AppImage"

      # Two for Windows as well: the portable folder, and an installer for people who would rather
      # double-click one thing. Compress-Archive has no exclude of its own, so the symbols go
      # before the archive is made. Inno Setup is already on the runner.
      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          $out = "${{ matrix.head }}/bin/Publish/${{ matrix.rid }}"
          Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "${{ github.workspace }}/Starquake-${{ matrix.rid }}.zip"

          # A tag is the only time there is a real version to stamp; every other run is a nightly.
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'iscc' }
          & $iscc /Qp `
            "/DPayloadDir=$((Resolve-Path $out).Path)" `
            "/DAppVersion=$version" `
            "/O${{ github.workspace }}" `
            Starquake.Windows\Starquake.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: Starquake-${{ matrix.rid }}
          path: Starquake-${{ matrix.rid }}*
          retention-days: 14

  # Tagging is the release process. Push a v* tag and the archives the publish job just built
  # become the assets on a GitHub Release; every other push leaves them as plain artifacts, which
  # expire. gh is already on the runner, so this needs no third-party action holding contents:write.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every build
        uses: actions/download-artifact@v4
        with:
          pattern: Starquake-*
          path: dist
          merge-multiple: true

      # working-directory, because this job has no checkout and so has no src/ to default into.
      - name: Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Built ahead of time: there is no .NET runtime to install on any platform.

          | Platform | Download | |
          | --- | --- | --- |
          | macOS (Apple Silicon) | `Starquake-osx-arm64.dmg` | Drag to Applications |
          | macOS (Intel) | `Starquake-osx-x64.dmg` | Drag to Applications |
          | Windows | `Starquake-win-x64-Setup.exe` | Installer, no administrator needed |
          | | `Starquake-win-x64.zip` | Portable folder |
          | Linux | `Starquake-linux-x64.AppImage` | `chmod +x` and run |
          | | `Starquake-linux-x64.tar.gz` | Portable folder |
          | Linux (ARM) | `Starquake-linux-arm64.AppImage` | `chmod +x` and run |
          | | `Starquake-linux-arm64.tar.gz` | Portable folder |

          **macOS** - the app is ad-hoc signed, which is what Apple Silicon requires to start it
          at all, and is not what Gatekeeper wants. A download from a browser is quarantined, so
          run `xattr -dr com.apple.quarantine /Applications/Starquake.app` after installing, or
          use System Settings → Privacy & Security → "Open Anyway". Control-clicking and
          choosing Open has not worked since macOS 15.

          **Windows** - SmartScreen will warn about an unsigned installer. More info → Run anyway.

          **Linux** - the AppImage needs `libfuse2`, which Ubuntu has not shipped by default
          since 22.04: `sudo apt install libfuse2`, or run it with `--appimage-extract-and-run`.
          The arm64 AppImage carries its own SDL2; the arm64 tarball does not, and wants
          `sudo apt install libsdl2-2.0-0` before it will start.
          NOTES
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Starquake ${{ github.ref_name }}" \
            --notes-file notes.md
