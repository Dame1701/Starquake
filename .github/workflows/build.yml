# The gate the repository did not have.
#
# "0 warnings, 65 tests green" was held by discipline alone until this file existed, and
# discipline is exactly what a `git bisect` six months from now cannot verify. Directory.Build.props
# sets TreatWarningsAsErrors, so a warning fails the build here rather than scrolling past in a log.
#
# Every project builds on every platform - the Windows head sets EnableWindowsTargeting - so one
# job would prove the code compiles. Three exist because the packaging does not travel: the .app
# bundle and its ad-hoc signature are a macOS-only target, and only a run on macOS builds them.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0 as well as 10.0: MGCB is a net8.0 application and so are ProjectMercury and its
          # content pipeline extension, which is why they target net8.0 while the game targets
          # net10.0. See BUILD.md.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Starquake.sln

      - name: Build
        run: dotnet build Starquake.sln --no-restore

      - name: Test
        run: dotnet test Starquake.Tests/Starquake.Tests.csproj --no-build

  # The open question, asked on every push instead of never.
  #
  # The three AOT heads were set up on a Mac, and NativeAOT does not cross-compile, so the Windows
  # one has never been run - see "Windows is wired up and unproven" in BUILD.md. MonoGame's
  # WindowsDX flavour brings Windows Forms with it, which Microsoft does not list as supported
  # under NativeAOT, and SharpDX, which predates trimming entirely. Nothing in the SDK blocks
  # either; whether what comes out of ILC is a working executable is the thing nobody here knows.
  #
  # continue-on-error because it is an experiment and not yet a promise: a failure should report
  # the answer, not turn main red for a build nobody ships yet. Turn it into a gate - drop that
  # line - the first time it passes. Only the publish runs: a GitHub runner has no GPU, so
  # launching the result would prove nothing beyond what the compile already did.
  windows-aot:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish NativeAOT
        run: dotnet publish Starquake.Windows/Starquake.Windows.csproj -p:PublishProfile=Aot-win-x64

  # A second gate the repository did not have. tools/namespace-cycles.py counts the namespaces in
  # Starquake.Shared that depend on each other both ways, and the count is zero. Nothing but this
  # keeps it there: C# has no rule against a namespace cycle - one assembly, so any type may
  # reference any other - which is why the count had drifted to fourteen before anything measured
  # it, through the whole of a plan whose stated goal was cutting cycles.
  #
  # Its own job rather than a step in the matrix above. It reads source and nothing else: no
  # restore, no build, no .NET, and no reason to run it once per operating system. It fails in
  # about a second, which is the point - a new cycle is one misfiled file, and it is far cheaper
  # to hear about before the three builds finish than after.
  namespaces:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No namespace cycles
        run: python3 tools/namespace-cycles.py
